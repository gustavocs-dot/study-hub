<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora&display=swap" rel="stylesheet">
  <style>
    :root {
      --cor-fundo: #F2F2F2;
      --cor-topo: #EBE3D8;
      --cor-card: #F8F5F4;
      --cor-borda: #D8D4D1;
      --cor-texto: #1F1A17;
      --cor-texto-suave: #6B5E55;
      --cor-destaque: #A8803F;
    }

    body {
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: 'Lora', serif;
      margin: 0;
    }

    header {
      background-color: var(--cor-topo);
      border-bottom: 1px solid var(--cor-borda);
      padding: 30px 40px;
    }

    h1, h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      margin: 0;
    }

    h1 {
      font-size: 44px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h2 {
      font-size: 32px;
      margin-top: 30px;
    }

    p {
      color: var(--cor-texto-suave);
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul ul {
      margin-left: 30px;
      margin-top: 10px;
    }

    li {
      margin-bottom: 12px;
    }

    a {
      display: block;
      background-color: var(--cor-card);
      color: var(--cor-texto);
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      padding: 20px 20px;
      border: 1px solid var(--cor-borda);
      border-radius: 6px;
    }

    a:hover {
      background-color: var(--cor-topo);
      border-color: var(--cor-destaque);
    }
  </style>
</head>
<body>
  <header>
    <h1>Study Hub</h1>
  </header>

  <main>
    <p>Portfólio acadêmico e profissional de Gustavo Costa Souza, estudante de Engenharia de Software no CEUB.</p>

    <h2>Conteúdo</h2>
    <ul>
      <li>
        <a href="https://github.com/gustavocs-dot/study-hub">Repositório completo (raiz)</a>
        <ul>
          <li><a href="https://github.com/gustavocs-dot/study-hub/tree/main/01_Apresentacao_e_Perfil">Apresentação e Perfil</a></li>
          <li><a href="https://github.com/gustavocs-dot/study-hub/tree/main/02_Disciplinas_Atuais">Disciplinas Atuais</a></li>
          <li><a href="https://github.com/gustavocs-dot/study-hub/tree/main/03_Projetos_e_Certificados">Projetos e Certificados</a></li>
        </ul>
      </li>
    </ul>
  </main>
</body>
</html>
